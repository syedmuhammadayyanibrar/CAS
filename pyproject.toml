[project]
name = "cas"
version = "1.0.0"
description = "Contract Agentic Society (CAS) - Federation of Independent Multi-Agent Systems"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "starlette>=0.38.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.0",
    "httpx>=0.27.0",
    "google-genai>=0.1.1",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.9",
    "rich>=13.7.0",
    "cryptography>=43.0.0",
    "python-dotenv>=1.0.0"
]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.vercel.scripts]
build = "python build.py"

[tool.vercel.fastapi.static]
cdn = true
